name: Build StandRise iOS IPA

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Project Parts from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading project parts from release v1.0.0..."
          gh release download v1.0.0 --repo ${{ github.repository }} --pattern "StandRise_iOS_part*" --dir .
          ls -lh StandRise_iOS_part*

      - name: Reassemble & Extract Xcode Project
        run: |
          echo "Merging parts..."
          cat StandRise_iOS_part* > StandRise_iOS.tar.gz
          echo "Extracting StandRise_iOS.tar.gz..."
          tar -xzf StandRise_iOS.tar.gz
          rm StandRise_iOS.tar.gz StandRise_iOS_part*
          ls -la StandRise_iOS_Xcode

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build Xcode Project
        run: |
          cd StandRise_iOS_Xcode
          xcodebuild clean build \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            -derivedDataPath build

      - name: Package into IPA
        run: |
          cd StandRise_iOS_Xcode
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found compiled App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r StandRise.ipa Payload
          ls -lh StandRise.ipa

      - name: Upload IPA to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 StandRise_iOS_Xcode/StandRise.ipa --repo ${{ github.repository }} --clobber
          echo "StandRise.ipa successfully uploaded to GitHub Release v1.0.0!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StandRise-iOS-IPA
          path: StandRise_iOS_Xcode/StandRise.ipa
